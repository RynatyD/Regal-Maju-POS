<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Restaurant POS</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#16222e;--mut:#68758a;--line:#dde1e8;--accent:#f2a900;--onacc:#1a1300;--ok:#23804d;--bad:#c23b22;--nav:#16222e;--onnav:#f3f4f6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--card:#192431;--ink:#eef1f5;--mut:#93a1b5;--line:#2a3a4c;--nav:#0a1118;--ok:#4cc17f;--bad:#ff7a63}}
:root[data-theme="dark"]{--bg:#0f1720;--card:#192431;--ink:#eef1f5;--mut:#93a1b5;--line:#2a3a4c;--nav:#0a1118;--ok:#4cc17f;--bad:#ff7a63}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Bricolage Grotesque",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{background:var(--nav);color:var(--onnav);display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--nav);z-index:10}
header h1{font-size:18px;margin:0 auto 0 0;font-weight:800}
.tab{background:none;border:0;color:var(--onnav);opacity:.65;padding:8px 12px;border-radius:8px;font-weight:600}
.tab[aria-selected=true]{opacity:1;background:rgba(255,255,255,.14)}
main{padding:14px;max-width:1200px;margin:auto}
.pos{display:grid;grid-template-columns:1fr 340px;gap:14px;align-items:start}
@media(max-width:820px){.pos{grid-template-columns:1fr}}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-weight:600}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tables{margin-bottom:12px}.pos[hidden]{display:none}.tbl{width:74px;height:74px;border-radius:10px;border:3px solid transparent;color:#fff;font-weight:800;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}.tbl small{font-size:11px;font-weight:600}.tbl.free{background:#23804d}.tbl.busy{background:#c23b22}.tbl[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 2px #fff}
.tables .chip{flex:none}.mode{display:flex;gap:8px;margin-bottom:10px}.mode button{flex:1;padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:16px}.mode button[aria-pressed=true]{background:var(--accent);color:var(--onacc);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px;margin-top:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:84px}
.item:active{transform:scale(.97)}.item b{font-weight:600}.item span{color:var(--mut);margin-top:auto}
.ticket{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;position:sticky;top:64px}
.ticket h2,.panel h2{font-size:16px;margin:0 0 8px;font-weight:800}
.line{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line)}
.line .n{flex:1}.qty{display:flex;align-items:center;gap:6px}
.qty button{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--bg)}
.tot{display:flex;justify-content:space-between;color:var(--mut);padding:2px 0}
.tot.g{color:var(--ink);font-size:20px;font-weight:800;padding-top:8px}
.btn{border:0;border-radius:9px;padding:11px 14px;font-weight:700;background:var(--accent);color:var(--onacc)}
.btn.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line)}.btn[disabled]{opacity:.4;cursor:not-allowed}
.empty{color:var(--mut);padding:14px 0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.kds{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--bg)}
.tag.new{background:var(--accent);color:var(--onacc)}.tag.ok{color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stats .panel{margin:0}.stats b{font-size:24px;display:block}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line)}
.wrap{overflow-x:auto}
dialog{border:0;border-radius:14px;padding:20px;width:min(380px,92vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
input{font:inherit;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.rcpt{font-family:ui-monospace,Menlo,monospace;font-size:13px;white-space:pre-wrap}
label{display:block;margin-bottom:10px;font-weight:600}label input{margin-top:4px;font-weight:400}
[hidden]{display:none!important}.gate{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:20px 16px;display:flex;justify-content:center;align-items:flex-start}.gate .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(400px,100%);margin-top:6vh}.gate h1{font-size:22px;margin:0 0 14px;display:flex;gap:10px;align-items:center}
#pa,#pb{display:none}#pa{white-space:pre;font:12px/1.3 ui-monospace,Menlo,monospace}@media print{body>*:not(#pa):not(#pb){display:none!important}body::before{display:none!important}body:not(.ph) #pa{display:block!important}body.ph{background:#fff!important}body.ph #pb{display:block!important;color:#000;background:#fff;font:12px/1.4 system-ui,sans-serif;padding:8mm}#pb table{width:100%;border-collapse:collapse;margin:8px 0 14px}#pb th,#pb td{border-bottom:1px solid #999;padding:4px 6px;text-align:left}#pb .r{text-align:right}@page{margin:2mm}}
</style>
<meta name="theme-color" content="#16222e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Kedai POS">
</head>
<body>
<header>
  <h1><button class="tab" data-v="home" id="brand" style="opacity:1;font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px"></button></h1>
  <button class="tab" role="tab" data-v="order" aria-selected="true">Order</button>
  <button class="tab" role="tab" data-v="kitchen" aria-selected="false">Kitchen</button>
  <button class="tab" role="tab" data-v="menu" aria-selected="false">Menu</button>
  <button class="tab" role="tab" data-v="stock" aria-selected="false">Stock</button>
  <button class="tab" role="tab" data-v="sales" aria-selected="false">Sales</button>
  <button class="tab" role="tab" data-v="close" aria-selected="false">Shift &amp; Day</button>
  <button class="tab" role="tab" data-v="accounts" aria-selected="false">Accounts</button>
  <button class="tab" role="tab" data-v="reports" aria-selected="false">Reports</button>
  <button class="tab" id="shopedit">Settings</button>
  <button class="tab" role="tab" data-v="team" aria-selected="false" hidden>Team</button>
  <span id="sync" style="font-size:12px;opacity:.7"></span><button class="tab" id="signout" hidden>Sign out</button>
</header>
<main id="app"></main>
<dialog id="dlg"></dialog>
<div class="gate" id="gate" hidden></div>
<div id="pa"></div>
<div id="pb"></div>
<dialog id="pwd"></dialog>
<dialog id="rpt" style="width:min(640px,94vw)"></dialog>
<script>
const RAW={
"Roti":"ROTI KOSONG:1,ROTI KOSONG BAWANG:2,ROTI TELUR:2,ROTI TELUR BAWANG:2.5,ROTI TELUR BAWANG CILLY:2.8,ROTI CHEESE:2.5,ROTI TAMPAL:2,ROTI PLANTA:2,ROTI SUSU:2,ROTI TISU:3.5,ROTI SARDIN:4,ROTI BOOM:2,ROTI PISANG:2.5,ROTI MILO:3.5,ROTI JANTAN:2",
"Murtabak":"MURTABAK AYAM:7,MURTABAK DAGING:8,MURTABAK KAMBING:9",
"Thosai & Chapathi":"THOSAI:1.8,THOSAI BAWANG:2.2,THOSAI TELUR:2.8,THOSAI SARDIN:4,CHAPATHI:1.8,CHAPATHI SARDIN:4,CHAPATHI TELUR:3",
"Rojak":"ROJAK BIASA:4.5,ROJAK MEE:5",
"Nan & Tandoori":"ROTI NAN BIASA:2.5,ROTI NAN BAWANG:3,ROTI NAN MILO:4,ROTI NAN CHEESE:4,ROTI NAN GARLIC:3.5,ROTI NAN CHEESE GARLIC:5,AYAM TANDOORI:7",
"Nasi":"NASI LEMAK TELUR:2.5,NASI LEMAK AYAM:6,NASI LEMAK KOSONG:1.5,NASI BRIYANI AYAM:7.5,NASI BRIYANI KAMBING:9.5,NASI BRIYANI DAGING:8.5,NASI GORENG BIASA:4.5,NASI GORENG KAMPUNG:5.5,NASI GORENG AYAM:6.5,NASI GORENG KAMPUNG AYAM:7,NASI GORENG IKAN MASIN:5,NASI PATAYA:7,NASI GORENG CINA:5,NASI GORENG KAMBING:8.5,NASI GORENG DAGING:7.5",
"Mee & Maggi":"MEE GORENG BIASA:4.5,MEE GORENG AYAM:6.5,BIHUN GORENG BIASA:4.5,BIHUN GORENG AYAM:6.5,MAGGI GORENG BIASA:4.5,MAGGI GORENG AYAM:6.5,MAGGI SUP:4.5",
"Minuman Panas":"HALIA O PANAS:1.2,AIR TIN PANAS:2.2,BARLI PANAS:1.8,HORLICK PANAS:2.2,KOPI PANAS:1.5,KOPI O PANAS:1,KOPI GINSENG PANAS:3,KOPI TONGKAT ALI PANAS:3,MILO PANAS:2,MILO O PANAS:1.9,NESCAFE PANAS:2,NESCAFE O PANAS:1.6,NESLO PANAS:2.5,SUSU BIASA PANAS:1.2,TEH PANAS:1.5,TEH O PANAS:1,TEH LIMAU O PANAS:1.4,TEH HALIA PANAS:1.8,COPPUCINO PANAS:3,SIRAP PANAS:1.3,SIRAP BANDUNG PANAS:1.8,SIRAP LIMAU PANAS:1.4,LAICI PANAS:2.3,LONGAN PANAS:2.7",
"Minuman Sejuk":"HALIA O SEJUK:1.6,AIR TIN SEJUK:2.2,BARLI SEJUK:2,HORLICK SEJUK:2.5,KOPI SEJUK:1.8,KOPI O SEJUK:1.5,KOPI GINSENG SEJUK:3,KOPI TONGKAT ALI SEJUK:3,MILO SEJUK:2.2,MILO O SEJUK:2,NESCAFE SEJUK:2.2,NESCAFE O SEJUK:1.8,NESLO SEJUK:2.8,SUSU BIASA SEJUK:1.6,TEH SEJUK:1.8,TEH O SEJUK:1.5,TEH LIMAU O SEJUK:1.8,TEH HALIA SEJUK:2,COPPUCINO SEJUK:3,SIRAP SEJUK:1.5,SIRAP BANDUNG SEJUK:2,SIRAP LIMAU SEJUK:1.8,LAICI SEJUK:2.6,LONGAN SEJUK:3"};
const tc=s=>s.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
let _id=0;let MENU=Object.entries(RAW).flatMap(([c,s])=>s.split(",").map(x=>{const[n,p]=x.split(":");return{id:++_id,n:tc(n),p:+p,c}}));
const cats=()=>["All",...new Set(MENU.map(m=>m.c))];
const TABLES=Array.from({length:30},(_,i)=>"T"+(i+1));
const SST=.06,SVC=.10;
let S={orders:{},kitchen:[],sales:[],seq:1,shop:{name:"Kedai POS",logo:null}};
try{const d=localStorage.getItem("pos1");if(d)S=Object.assign(S,JSON.parse(d))}catch(e){}
const DEF=JSON.parse(JSON.stringify(MENU));
if(Array.isArray(S.menu)&&S.menu.length)MENU=S.menu;
let view="home",cat="Roti",table="T1",dineTable="T1",tOpen=false;
const save=()=>{S.menu=MENU;try{if(!window.CLOUD)localStorage.setItem("pos1",JSON.stringify(S))}catch(e){}if(window.cloudSync)cloudSync()};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);const rm=v=>"RM "+v.toFixed(2);
const $=s=>document.querySelector(s);
const cur=()=>S.orders[table]||[];
function calc(l){const sub=l.reduce((a,x)=>a+x.p*x.q,0);const svc=table==="Takeaway"?0:sub*SVC;const tax=(sub+svc)*SST;return{sub,svc,tax,total:Math.round((sub+svc+tax)*20)/20}}
function add(id){const m=MENU.find(x=>x.id===id);const l=S.orders[table]=cur();const e=l.find(x=>x.id===id&&!x.sent);e?e.q++:l.push({id,n:m.n,p:m.p,q:1,sent:false});save();render()}
function chg(i,d){const l=cur();l[i].q+=d;if(l[i].q<1)l.splice(i,1);if(!l.length)delete S.orders[table];save();render()}
function send(){const l=cur().filter(x=>!x.sent);if(!l.length)return;S.kitchen.push({id:uid(),no:S.seq++,table,items:l.map(x=>({n:x.n,q:x.q})),t:Date.now(),done:false});cur().forEach(x=>x.sent=true);save();render()}
function pay(){const t=calc(cur());const d=$("#dlg");
d.innerHTML=`<h2 style="margin-top:0">Take payment</h2><p>${table} · <b>${rm(t.total)}</b></p>
<div class="row"><button class="btn" id="card">Card</button><button class="btn alt" id="cashgo">Cash</button></div>
<div id="cashbox" hidden style="margin-top:12px"><label>Cash received (RM)<input id="tend" type="number" step="0.05" min="0" value="${Math.ceil(t.total)}"></label>
<p id="chg" class="tot g"></p><button class="btn" id="paycash">Complete cash sale</button></div>
<p><button class="btn alt" id="x">Cancel</button></p>`;
d.showModal();
const done=m=>{const l=cur();const s={id:uid(),no:S.sales.length+1,table,items:l.map(x=>({n:x.n,q:x.q,p:x.p})),...t,m,t:Date.now()};
 S.sales.push(s);S.kitchen.forEach(k=>{if(k.table===table)k.done=true});delete S.orders[table];tOpen=false;save();receipt(s)};
$("#x").onclick=()=>d.close();$("#card").onclick=()=>done("Card");
$("#cashgo").onclick=()=>{$("#cashbox").hidden=false;upd()};
const upd=()=>{const v=parseFloat($("#tend").value)||0;const c=v-t.total;$("#chg").textContent=c>=0?"Change "+rm(c):"Short by "+rm(-c);$("#paycash").disabled=c<0};
$("#tend").oninput=upd;$("#paycash").onclick=()=>done("Cash")}
function receipt(s){const d=$("#dlg");const w=n=>n.padEnd(22).slice(0,22);
let r=`${S.shop.name.toUpperCase()}\nReceipt #${s.no}  ${s.table}\n${new Date(s.t).toLocaleString()}\n--------------------------------\n`;
s.items.forEach(i=>r+=`${w(i.q+" x "+i.n)}${(i.p*i.q).toFixed(2).padStart(9)}\n`);
r+=`--------------------------------\n${w("Subtotal")}${s.sub.toFixed(2).padStart(9)}\n`;
if(s.svc)r+=`${w("Service 10%")}${s.svc.toFixed(2).padStart(9)}\n`;
r+=`${w("SST 6%")}${s.tax.toFixed(2).padStart(9)}\n${w("TOTAL")}${s.total.toFixed(2).padStart(9)}\nPaid by ${s.m}\nThank you!`;
d.innerHTML=`<div class="rcpt">${r}</div><p class="row"><button class="btn" onclick="window.print()">Print</button><button class="btn alt" id="x">Close</button></p>`;
$("#x").onclick=()=>{d.close();render()};render()}
function vOrder(){if(!cats().includes(cat))cat="All";const l=cur(),t=calc(l);
const items=MENU.filter(m=>cat==="All"||m.c===cat);
const take=table==="Takeaway";
return`<div class="mode" role="group" aria-label="Order type"><button data-mode="dine" aria-pressed="${!take}">Dine-in</button><button data-mode="take" aria-pressed="${take}">Takeaway</button></div>
${take?"":tOpen?`<button class="btn alt" id="back" style="margin-bottom:10px">Back to tables</button>`:`<p class="empty" style="margin:0 0 8px">Tap a table to open it and add items.</p><div class="row tables" role="group" aria-label="Tables">${TABLES.map(x=>`<button class="tbl ${S.orders[x]?"busy":"free"}" aria-pressed="${x===table}" data-t="${x}">${x}<small>${S.orders[x]?"Occupied":"Empty"}</small></button>`).join("")}</div>`}
<div class="pos" ${!take&&!tOpen?"hidden":""}><section><div class="row">${cats().map(c=>`<button class="chip" aria-pressed="${c===cat}" data-c="${c}">${c}</button>`).join("")}</div>
<div class="grid">${items.map(m=>{const q=stk()[m.id],out=q!==undefined&&q<=0;return`<button class="item" data-a="${m.id}" ${out?'disabled style="opacity:.45"':""}><b>${m.n}</b><span>${out?"Sold out":rm(m.p)+(q!==undefined&&q<=5?" · "+q+" left":"")}</span></button>`}).join("")}</div></section>
<aside class="ticket"><h2>${table} order</h2>
${l.length?l.map((x,i)=>`<div class="line"><span class="n">${x.n}${x.sent?' <span class="tag ok">sent</span>':""}<br><small style="color:var(--mut)">${rm(x.p)}</small></span>
<span class="qty"><button data-m="${i}" aria-label="Remove one">−</button>${x.q}<button data-p="${i}" aria-label="Add one">+</button></span></div>`).join(""):'<p class="empty">Tap a menu item to start this order.</p>'}
<div style="margin-top:10px"><div class="tot"><span>Subtotal</span><span>${rm(t.sub)}</span></div>
${t.svc?`<div class="tot"><span>Service 10%</span><span>${rm(t.svc)}</span></div>`:""}
<div class="tot"><span>SST 6%</span><span>${rm(t.tax)}</span></div>
<div class="tot g"><span>Total</span><span>${rm(t.total)}</span></div></div>
<div class="row" style="margin-top:12px"><button class="btn alt" id="send" ${l.some(x=>!x.sent)?"":"disabled"}>Send to kitchen</button>
<button class="btn" id="pay" ${l.length?"":"disabled"}>Pay</button></div></aside></div>`}
function vKitchen(){const k=S.kitchen.filter(x=>!x.done).sort((a,b)=>a.t-b.t);
return`<div class="panel"><h2>Kitchen tickets</h2>${k.length?"":'<p class="empty">No open tickets. Sent orders show up here.</p>'}
<div class="kds">${k.map(x=>`<div class="panel" style="margin:0"><div class="row" style="justify-content:space-between"><b>#${x.no} · ${x.table}</b><span class="tag new">${Math.max(0,Math.round((Date.now()-x.t)/60000))} min</span></div>
${x.items.map(i=>`<div class="line"><span class="n">${i.q} × ${i.n}</span></div>`).join("")}
<p><button class="btn" data-d="${x.no}">Mark ready</button></p></div>`).join("")}</div></div>`}
function vSales(){const day=new Date().toDateString();const s=S.sales.filter(x=>new Date(x.t).toDateString()===day);
const tot=s.reduce((a,x)=>a+x.total,0),cash=s.filter(x=>x.m==="Cash").reduce((a,x)=>a+x.total,0);
const cnt={};s.forEach(x=>x.items.forEach(i=>cnt[i.n]=(cnt[i.n]||0)+i.q));
const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5);
return`<div class="stats"><div class="panel"><b>${rm(tot)}</b>Today’s sales</div><div class="panel"><b>${s.length}</b>Orders paid</div>
<div class="panel"><b>${rm(s.length?tot/s.length:0)}</b>Average order</div><div class="panel"><b>${rm(cash)}</b>Cash in drawer</div></div>
<div class="panel"><h2>Best sellers</h2>${top.length?top.map(t=>`<div class="line"><span class="n">${t[0]}</span><b>${t[1]}</b></div>`).join(""):'<p class="empty">No sales yet today.</p>'}</div>
<div class="panel"><div class="row" style="justify-content:space-between;align-items:center"><h2>Recent sales</h2><button class="btn alt" id="psd">Print today</button></div><div class="wrap"><table><tr><th>#</th><th>Table</th><th>Time</th><th>Paid</th><th>Total</th></tr>
${s.slice(-10).reverse().map(x=>`<tr><td>${x.no}</td><td>${x.table}</td><td>${new Date(x.t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</td><td>${x.m}</td><td>${rm(x.total)}</td></tr>`).join("")}</table></div>
</div>`}
const logo=(s,l=S.shop.logo)=>l?`<img src="${l}" alt="" style="height:${s}px;width:auto;max-width:100%;object-fit:contain;border-radius:8px">`:`<svg width="${s}" height="${s}" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#f2a900"/><circle cx="33" cy="33" r="12" fill="none" stroke="#1a1300" stroke-width="3"/><path d="M9 14v12M14 14v12M19 14v12M9 26h10M14 26v26M53 14c-5 3-6 11-3 17h3v21" fill="none" stroke="#1a1300" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function vHome(){const day=new Date().toDateString();const n=S.sales.filter(x=>new Date(x.t).toDateString()===day).length;const open=Object.keys(S.orders).length,k=S.kitchen.filter(x=>!x.done).length;
return`<div class="panel" style="text-align:center;padding:28px 14px">${logo(S.shop.logo?140:96)}<h2 style="font-size:28px;margin:12px 0 2px">${S.shop.name}</h2><p style="color:var(--mut);margin:0 0 16px">${new Date().toLocaleDateString([],{weekday:"long",day:"numeric",month:"long"})}</p>
<div class="row" style="justify-content:center"><button class="btn" data-go="dine">Dine-in</button><button class="btn" data-go="take">Takeaway</button></div>

<p style="color:var(--mut);margin-bottom:0">${open} open orders, ${n} paid today, ${openShift()?"shift open":"no shift open"}</p></div><p style="text-align:center;color:var(--mut);margin:18px 0 8px">Created by Shakir</p>`}
function editShop(){const d=$("#dlg");let lg=S.shop.logo;
d.innerHTML=`<h2 style="margin-top:0">Restaurant details</h2><label>Restaurant name<input id="sn" value="${S.shop.name}" maxlength="40"></label>
<label>Logo image<input id="sl" type="file" accept="image/*"></label><div id="sp" style="margin-bottom:10px">${logo(64)}</div>
<div class="row"><button class="btn" id="ss">Save</button><button class="btn alt" id="sr">Use default logo</button><button class="btn alt" id="x">Cancel</button></div>`;

$("#sr").onclick=()=>{lg=null;$("#sp").innerHTML=logo(64,null)};
$("#sl").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");const k=Math.min(1,600/Math.max(im.width,im.height));c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);lg=c.toDataURL("image/png");$("#sp").innerHTML=logo(64,lg)};im.src=r.result};r.readAsDataURL(f)};
$("#ss").onclick=()=>{S.shop.name=$("#sn").value.replace(/[<>"]/g,"").trim()||"My Restaurant";S.shop.logo=lg;save();d.close();render()}}
let mq="";
const mlist=()=>{const q=mq.trim().toLowerCase();const f=MENU.filter(m=>!q||m.n.toLowerCase().includes(q)||m.c.toLowerCase().includes(q));
if(!f.length)return'<p class="empty">No items match. Tap Add item to create one.</p>';
return`<div class="wrap"><table><tr><th>Item</th><th>Category</th><th>Price</th><th></th></tr>${f.map(m=>`<tr><td>${m.n}</td><td>${m.c}</td><td>${rm(m.p)}</td><td style="white-space:nowrap"><button class="btn alt" data-e="${m.id}">Edit</button> <button class="btn alt" data-x="${m.id}" aria-label="Delete ${m.n}">Delete</button></td></tr>`).join("")}</table></div>`};

<p><input id="mq" type="search" placeholder="Search by name or category" value="${mq}" aria-label="Search menu"></p><div id="mlist">${mlist()}</div></div>`}
function editItem(id){const m=id?MENU.find(x=>x.id===id):{n:"",p:"",c:cat==="All"?"":cat};const d=$("#dlg");
d.innerHTML=`<h2 style="margin-top:0">${id?"Edit item":"Add item"}</h2>
<label>Name<input id="fn" value="${m.n}" maxlength="40"></label>
<label>Price (RM)<input id="fp" type="number" step="0.05" min="0" value="${m.p}"></label>
<label>Category<input id="fc" list="cl" value="${m.c}" maxlength="30"></label><datalist id="cl">${cats().slice(1).map(c=>`<option value="${c}">`).join("")}</datalist>
<p id="fe" style="color:var(--bad)" role="alert"></p>
<div class="row"><button class="btn" id="fs">Save item</button><button class="btn alt" id="x">Cancel</button></div>`;
d.showModal();$("#x").onclick=()=>d.close();
$("#fs").onclick=()=>{const n=$("#fn").value.replace(/[<>"]/g,"").trim(),c=$("#fc").value.replace(/[<>"]/g,"").trim(),p=parseFloat($("#fp").value);
if(!n||!c||!(p>=0)){$("#fe").textContent="Enter a name, a category and a price of 0 or more.";return}
if(id)Object.assign(m,{n,p,c});else MENU.push({id:Date.now(),n,p,c});
save();d.close();render()}}
document.addEventListener("input",e=>{if(e.target.id==="mq"){mq=e.target.value.replace(/"/g,"");$("#mlist").innerHTML=mlist()}});
function render(){document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===view));
$("#brand").innerHTML=logo(28)+" "+S.shop.name;document.title=S.shop.name;$("#app").innerHTML=view==="home"?vHome():view==="order"?vOrder():view==="kitchen"?vKitchen():view==="menu"?vMenu():vSales()}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const D=b.dataset;
if(D.v){view=D.v;render()}else if(D.t){table=dineTable=D.t;tOpen=true;render()}else if(D.mode){table=D.mode==="take"?"Takeaway":dineTable;tOpen=false;render()}else if(D.c){cat=D.c;render()}
else if(D.a)add(+D.a);else if(D.m!==undefined)chg(+D.m,-1);else if(D.p!==undefined)chg(+D.p,1);
else if(D.d){S.kitchen.find(x=>x.no==D.d).done=true;save();render()}
else if(D.go){table=D.go==="take"?"Takeaway":dineTable;view="order";tOpen=false;render()}else if(b.id==="back"){tOpen=false;render()}else if(b.id==="shopedit")editShop();
else if(D.e)editItem(+D.e);else if(b.id==="addi")editItem(0);
else if(D.x){delGuard("Delete this menu item? Open orders keep it.").then(ok=>{if(ok){MENU=MENU.filter(m=>m.id!==+D.x);save();render()}})}
else if(b.id==="send")send();else if(b.id==="pay")pay();
else if(b.id==="reset"&&!window.CLOUD&&true){delGuard("Delete ALL orders and sales on this device?").then(ok=>{if(ok){S={orders:{},kitchen:[],sales:[],seq:1,stock:{},ledger:[],shifts:[],days:[],shop:S.shop};save();render()}})}});
setInterval(()=>{if(view==="kitchen")render()},30000);
</script>
<script>
const stk=()=>(S.stock=S.stock||{});
let PRN=null,RMON=new Date().getFullYear()+"-"+String(new Date().getMonth()+1).padStart(2,"0");
async function connectPrinter(){try{const d=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:["000018f0-0000-1000-8000-00805f9b34fb","e7810a71-73ae-499d-8c15-faa9aef0c3f2","49535343-fe7d-4ae5-8fa9-9fafd205e455"]});const g=await d.gatt.connect();for(const s of await g.getPrimaryServices())for(const c of await s.getCharacteristics())if(c.properties.write||c.properties.writeWithoutResponse){PRN=c;return d.name||"Printer"}}catch(e){}return null}
async function printJob(t){
 if(PRN){try{const b=new TextEncoder().encode("\x1b@"+t+"\n\n\n\x1d\x56\x00");for(let i=0;i<b.length;i+=100){const ch=b.slice(i,i+100);PRN.properties.writeWithoutResponse?await PRN.writeValueWithoutResponse(ch):await PRN.writeValue(ch)}return}catch(e){PRN=null}}
 document.body.classList.remove("ph");const a=document.getElementById("pa");a.textContent=t;a.style.width=S.shop.paper==="80"?"72mm":"48mm";window.print()}
function kitchenText(k){let r=`KITCHEN #${k.no}\n${k.table}  ${new Date(k.t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}\n--------------------------------\n`;k.items.forEach(i=>r+=`${i.q} x ${i.n}\n`);return r}
function imgData(f,max){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/png"))};im.src=fr.result};fr.readAsDataURL(f)})}
function editShop(){const d=$("#dlg"),sh=S.shop;let lg=sh.logo,qr=sh.qr||null;
d.innerHTML=`<h2 style="margin-top:0">Settings</h2>
<label>Restaurant name<input id="sn" value="${sh.name}" maxlength="40"></label>
<label>Logo image<input id="sl" type="file" accept="image/*"></label><div id="sp" style="margin-bottom:10px">${logo(64,lg)} <button class="btn alt" id="sr">Default logo</button></div>
<label>DuitNow QR image (save it from your bank or merchant app)<input id="sq" type="file" accept="image/*"></label><div id="sqp" style="margin-bottom:10px">${qr?`<img src="${qr}" alt="QR" height="90">`:""}</div>
<label>Receipt paper<select id="spp"><option value="58">58 mm</option><option value="80" ${sh.paper==="80"?"selected":""}>80 mm</option></select></label>
<label><input type="checkbox" id="sau" style="width:auto" ${sh.auto?"checked":""}> Auto-print kitchen ticket when sending</label>
<p class="row"><button class="btn alt" id="spc">Connect Bluetooth printer</button><button class="btn alt" id="spt">Test print</button></p><p id="spm" style="color:var(--mut)"></p>
${window.verifyPw?"":'<p><button class="btn alt" id="spw">Set or change delete password</button></p>'}
${window.billingHTML?window.billingHTML():""}
<div class="row"><button class="btn" id="ss">Save</button><button class="btn alt" id="x">Cancel</button></div>`;
d.showModal();$("#x").onclick=()=>d.close();
$("#sr").onclick=()=>{lg=null;$("#sp").innerHTML=logo(64,null)};
$("#sl").onchange=async e=>{if(e.target.files[0]){lg=await imgData(e.target.files[0],600);$("#sp").innerHTML=logo(64,lg)}};
$("#sq").onchange=async e=>{if(e.target.files[0]){qr=await imgData(e.target.files[0],500);$("#sqp").innerHTML=`<img src="${qr}" alt="QR" height="90">`}};
$("#spc").onclick=async()=>{const n=await connectPrinter();$("#spm").textContent=n?"Connected: "+n:"Could not connect. Bluetooth printing needs Chrome on Android or desktop; browser printing still works."};
$("#spt").onclick=()=>{S.shop.paper=$("#spp").value;printJob("TEST PRINT\n"+S.shop.name)};
$("#ss").onclick=()=>{S.shop=Object.assign({},sh,{name:$("#sn").value.replace(/[<>"]/g,"").trim()||"My Restaurant",logo:lg,qr:qr,paper:$("#spp").value,auto:$("#sau").checked});save();d.close();render()}}
function stockAdj(id,q){const k=stk();if(k[id]===undefined)return;k[id]+=q;if(window.cloudStock)cloudStock("adjust_stock",{p_item:String(id),p_delta:q})}
function add(id){const m=MENU.find(x=>x.id===id),k=stk();if(k[id]!==undefined&&k[id]<=0)return;const l=S.orders[table]=cur();const e=l.find(x=>x.id===id&&!x.sent);if(e&&k[id]!==undefined&&e.q>=k[id])return;e?e.q++:l.push({id,n:m.n,p:m.p,q:1,sent:false});save();render()}
function send(){const l=cur().filter(x=>!x.sent);if(!l.length)return;const tk={id:uid(),no:S.seq++,table,items:l.map(x=>({n:x.n,q:x.q})),t:Date.now(),done:false};S.kitchen.push(tk);cur().forEach(x=>x.sent=true);save();render();if(S.shop.auto)printJob(kitchenText(tk))}
function pay(){if(!openShift()){startShift(pay);return}const t=calc(cur()),d=$("#dlg");
d.innerHTML=`<h2 style="margin-top:0">Take payment</h2><p>${table} · <b>${rm(t.total)}</b></p>
<div class="row"><button class="btn" id="card">Card</button><button class="btn" id="qr">DuitNow QR</button><button class="btn alt" id="cashgo">Cash</button></div>
<div id="box" style="margin-top:12px"></div><p><button class="btn alt" id="x">Cancel</button></p>`;d.showModal();
const done=m=>{const l=cur();const s={id:uid(),no:S.sales.length+1,table,items:l.map(x=>({n:x.n,q:x.q,p:x.p})),...t,m,t:Date.now()};
 S.sales.push(s);S.kitchen.forEach(k=>{if(k.table===table)k.done=true});l.forEach(x=>stockAdj(x.id,-x.q));delete S.orders[table];tOpen=false;save();receipt(s)};
const ask=(h,m)=>{$("#box").innerHTML=h+`<p><button class="btn" id="ok">Payment received</button></p>`;$("#ok").onclick=()=>done(m)};
$("#x").onclick=()=>d.close();
$("#card").onclick=()=>ask(`<p>Charge <b>${rm(t.total)}</b> on your card terminal, then confirm.</p>`,"Card");
$("#qr").onclick=()=>ask(S.shop.qr?`<img src="${S.shop.qr}" alt="DuitNow QR" style="max-width:100%;max-height:260px;display:block;margin:auto"><p>Customer pays <b>${rm(t.total)}</b>. Check the amount in your bank app, then confirm.</p>`:`<p>No QR saved yet. Add your DuitNow QR in Settings.</p>`,"DuitNow QR");
$("#cashgo").onclick=()=>{$("#box").innerHTML=`<label>Cash received (RM)<input id="tend" type="number" step="0.05" min="0" value="${Math.ceil(t.total)}"></label><p id="chg" class="tot g"></p><button class="btn" id="paycash">Complete cash sale</button>`;
 const u=()=>{const c=(parseFloat($("#tend").value)||0)-t.total;$("#chg").textContent=c>=0?"Change "+rm(c):"Short by "+rm(-c);$("#paycash").disabled=c<0};$("#tend").oninput=u;u();$("#paycash").onclick=()=>done("Cash")}}
function receipt(s){const d=$("#dlg"),w=n=>n.padEnd(22).slice(0,22);
let r=`${S.shop.name.toUpperCase()}\nReceipt #${s.no}  ${s.table}\n${new Date(s.t).toLocaleString()}\n--------------------------------\n`;
s.items.forEach(i=>r+=`${w(i.q+" x "+i.n)}${(i.p*i.q).toFixed(2).padStart(9)}\n`);
r+=`--------------------------------\n${w("Subtotal")}${s.sub.toFixed(2).padStart(9)}\n`;
if(s.svc)r+=`${w("Service 10%")}${s.svc.toFixed(2).padStart(9)}\n`;
r+=`${w("SST 6%")}${s.tax.toFixed(2).padStart(9)}\n${w("TOTAL")}${s.total.toFixed(2).padStart(9)}\nPaid by ${s.m}\nThank you!`;
d.innerHTML=`<div class="rcpt">${r}</div><p class="row"><button class="btn" id="prn">Print</button><button class="btn alt" id="x">Close</button></p>`;
$("#prn").onclick=()=>printJob(r);$("#x").onclick=()=>{d.close();render()};render()}
function vKitchen(){const k=S.kitchen.filter(x=>!x.done).sort((a,b)=>a.t-b.t);
return`<div class="panel"><h2>Kitchen tickets</h2>${k.length?"":'<p class="empty">No open tickets. Sent orders show up here.</p>'}
<div class="kds">${k.map(x=>`<div class="panel" style="margin:0"><div class="row" style="justify-content:space-between"><b>#${x.no} · ${x.table}</b><span class="tag new">${Math.max(0,Math.round((Date.now()-x.t)/60000))} min</span></div>
${x.items.map(i=>`<div class="line"><span class="n">${i.q} × ${i.n}</span></div>`).join("")}
<p class="row"><button class="btn" data-d="${x.no}">Mark ready</button><button class="btn alt" data-pk="${x.no}">Print</button></p></div>`).join("")}</div></div>`}
function vStock(){const k=stk();return`<div class="panel"><h2>Stock</h2><p style="color:var(--mut)">Enter how many you have. Leave blank to not track an item. Sold-out items cannot be ordered.</p><div class="wrap"><table><tr><th>Item</th><th>In stock</th></tr>${MENU.map(m=>`<tr><td>${m.n}</td><td><input type="number" min="0" style="width:90px" data-st="${m.id}" value="${k[m.id]===undefined?"":k[m.id]}" aria-label="Stock for ${m.n}"></td></tr>`).join("")}</table></div></div>`}
function repShell(){return`<div class="panel"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">Monthly report</h2><span class="row"><input id="rmn" type="month" value="${RMON}" style="width:auto"><button class="btn alt" id="prp">Print report</button><button class="btn alt" id="csv">Export CSV</button></span></div></div><div id="rep"><p class="empty">Loading...</p></div>`}
let REPROWS=[];
async function repData(ym){const[y,m]=ym.split("-").map(Number),a=new Date(y,m-1,1),b=new Date(y,m,1);const mp={};
 S.sales.filter(s=>s.t>=a&&s.t<b).forEach(s=>mp[s.id||s.t]=s);
 if(window.cloudSales){try{(await cloudSales(a,b)).forEach(s=>mp[s.id||s.t]=s)}catch(e){}}
 return Object.values(mp).sort((p,q)=>p.t-q.t)}
async function fillRep(){const ym=RMON,rows=await repData(ym);REPROWS=rows;if(view!=="reports"||!document.getElementById("rep"))return;
 const[y,m]=ym.split("-").map(Number),sum=(f)=>rows.reduce((a,s)=>a+(s[f]||0),0),tot=sum("total"),by={},day={},it={};
 rows.forEach(s=>{by[s.m]=(by[s.m]||0)+s.total;const dd=new Date(s.t).getDate();day[dd]=(day[dd]||0)+s.total;s.items.forEach(i=>{const o=it[i.n]=it[i.n]||{q:0,v:0};o.q+=i.q;o.v+=i.q*i.p})});
 const nd=new Date(y,m,0).getDate(),mx=Math.max(0,...Object.values(day));
 const bars=[...Array(nd)].map((_,i)=>{const v=day[i+1]||0;return`<div title="${i+1}: ${rm(v)}" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%"><div style="width:70%;height:${mx?v/mx*100:0}%;min-height:${v?2:0}px;background:var(--accent);border-radius:3px 3px 0 0"></div><small style="font-size:9px;color:var(--mut)">${i+1}</small></div>`}).join("");
 const top=Object.entries(it).sort((a,b)=>b[1].q-a[1].q).slice(0,10);
 const pl=plHTML(tot-sum("tax"),ym);document.getElementById("rep").innerHTML=`<div class="stats"><div class="panel"><b>${rm(tot)}</b>Sales</div><div class="panel"><b>${rows.length}</b>Orders</div><div class="panel"><b>${rm(rows.length?tot/rows.length:0)}</b>Average order</div><div class="panel"><b>${rm(sum("tax"))}</b>SST collected</div></div>
${pl}<div class="panel"><h2>Sales by day</h2><div style="display:flex;height:150px;gap:2px">${bars}</div></div>
<div class="panel"><h2>By payment method</h2>${Object.keys(by).length?Object.entries(by).map(([k,v])=>`<div class="line"><span class="n">${k}</span><b>${rm(v)}</b></div>`).join(""):'<p class="empty">No sales this month.</p>'}</div>
<div class="panel"><h2>Top items</h2>${top.map(([k,v])=>`<div class="line"><span class="n">${k}</span><span>${v.q} sold</span> <b>${rm(v.v)}</b></div>`).join("")||'<p class="empty">No sales this month.</p>'}</div>`}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.pk){const k=S.kitchen.find(x=>x.no==b.dataset.pk);if(k)printJob(kitchenText(k))}
 else if(b.id==="csv"){const q=v=>'"'+String(v).replace(/"/g,'""')+'"';let c="no,date,table,payment,subtotal,service,sst,total\n";REPROWS.forEach(s=>c+=[s.no,q(new Date(s.t).toLocaleString()),q(s.table),q(s.m),s.sub.toFixed(2),s.svc.toFixed(2),s.tax.toFixed(2),s.total.toFixed(2)].join(",")+"\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([c],{type:"text/csv"}));a.download="sales-"+RMON+".csv";a.click()}});
document.addEventListener("change",e=>{const t=e.target;
 if(t.id==="rmn"&&t.value){RMON=t.value;fillRep()}
 else if(t.dataset&&t.dataset.st){const id=t.dataset.st,k=stk(),v=t.value===""?null:Math.max(0,+t.value);
  if(v===null)delete k[id];else k[id]=v;
  if(window.cloudStock)cloudStock("set_stock",{p_item:String(id),p_qty:v});else save()}});
let LT="purchase";
const LABEL={purchase:"Purchases",expense:"Expenses",salary:"Salary"},LDEF={purchase:{party:"Supplier",desc:"Items bought"},expense:{party:"Category",desc:"Details"},salary:{party:"Employee",desc:"Note"}};
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const led=()=>(S.ledger=S.ledger||[]);
const dl=(n,t)=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv"}));a.download=n;a.click()};
function vAccounts(){const L=led().filter(x=>x.date.startsWith(RMON)),tot=t=>L.filter(x=>x.type===t).reduce((a,x)=>a+x.amount,0),rows=L.filter(x=>x.type===LT).sort((a,b)=>b.date.localeCompare(a.date));
return`<div class="panel"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">Accounts</h2><input id="rmn2" type="month" value="${RMON}" style="width:auto" aria-label="Month"></div>
<div class="stats" style="margin:12px 0 0">${["purchase","expense","salary"].map(t=>`<div class="panel" style="margin:0"><b>${rm(tot(t))}</b>${LABEL[t]}</div>`).join("")}<div class="panel" style="margin:0"><b>${rm(tot("purchase")+tot("expense")+tot("salary"))}</b>Total costs</div></div></div>
<div class="row" style="margin-bottom:10px">${["purchase","expense","salary"].map(t=>`<button class="chip" data-lt="${t}" aria-pressed="${t===LT}">${LABEL[t]}</button>`).join("")}<span style="flex:1"></span><button class="btn alt" id="lprn">Print</button><button class="btn alt" id="lcsv">Export CSV</button><button class="btn" id="ladd">Add ${LT==="salary"?"salary entry":LT}</button></div>
<div class="panel"><div class="wrap">${rows.length?`<table><tr><th>Date</th><th>${LDEF[LT].party}</th><th>${LT==="salary"?"Type":LDEF[LT].desc}</th><th>Paid by</th><th>Amount</th><th></th></tr>${rows.map(x=>`<tr><td>${x.date}</td><td>${x.party}</td><td>${x.desc||""}</td><td>${x.pay==="Credit"?'<span class="tag new">Unpaid</span>':x.pay||""}</td><td>${rm(x.amount)}</td><td style="white-space:nowrap"><button class="btn alt" data-le="${x.id}">Edit</button> <button class="btn alt" data-ld="${x.id}" aria-label="Delete entry">Delete</button></td></tr>`).join("")}</table>`:'<p class="empty">No entries this month. Tap Add to record one.</p>'}</div></div>`}

 else if(kind==="ledger"&&S.ledger)S.ledger=S.ledger.filter(function(x){return x.id!==id});
 else if(kind==="shift")S.shifts=(S.shifts||[]).filter(function(x){return x.id!==id});
 else if(kind==="day")S.days=(S.days||[]).filter(function(x){return x.id!==id})}
function fixSeq(){S.seq=Math.max.apply(null,[1].concat(S.kitchen.map(function(k){return(k.no||0)+1})))}

async function push(){
 if(!RID)return;
 var cur=docsNow(),up=[],del=[],sent={},k,i,j;
 for(k in cur){j=JSON.stringify(cur[k]);if(last[k]===j)continue;i=k.indexOf("|");
  if(!can(k.slice(0,i))){last[k]=j;continue}
  up.push({restaurant_id:RID,kind:k.slice(0,i),id:k.slice(i+1),data:cur[k],updated_by:UID,updated_at:new Date().toISOString()});sent[k]=j}
 for(k in last)if(!(k in cur)){if(can(k.slice(0,k.indexOf("|"))))del.push(k);else delete last[k]}
 if(!up.length&&!del.length)return;
 status("Saving...");
 try{
  if(up.length){var r=await sb.from("docs").upsert(up);if(r.error)throw r.error}
  for(var n=0;n<del.length;n++){k=del[n];i=k.indexOf("|");
   var d=await sb.from("docs").delete().eq("restaurant_id",RID).eq("kind",k.slice(0,i)).eq("id",k.slice(i+1));if(d.error)throw d.error}
  Object.assign(last,sent);del.forEach(function(x){delete last[x]});status("Synced");cacheSave()
 }catch(e){status("Sync failed, retrying");setTimeout(function(){window.cloudSync()},5000)}}

function cacheSave(){if(!UID||!META)return;try{localStorage.setItem("kp-"+UID,JSON.stringify({m:META,S:S,MENU:MENU,last:last,pend:PEND}))}catch(e){}}
function loadCache(){try{return JSON.parse(localStorage.getItem("kp-"+UID)||"null")}catch(e){return null}}
function fetchDocs(){var d0=new Date();d0.setHours(0,0,0,0);return sb.from("docs").select("kind,id,data").eq("restaurant_id",RID).or("created_at.gte."+d0.toISOString()+",and(kind.neq.sale,kind.neq.ticket)").limit(5000)}
async function flush(){if(flushing||!RID)return;flushing=true;
 try{while(PEND.length){var p=PEND[0],r=await sb.rpc(p.fn,p.args);if(r.error&&/fetch|network|Failed/i.test(r.error.message||"")){setTimeout(flush,8000);break}PEND.shift();cacheSave()}}finally{flushing=false}}
window.cloudStock=function(fn,args){PEND.push({fn:fn,args:args});cacheSave();flush()};
async function resync(){if(!RID)return;var r=await fetchDocs();if(r.error)return;var cur=docsNow(),seen={},k,c;
 (r.data||[]).forEach(function(x){k=x.kind+"|"+x.id;seen[k]=1;
  if(x.kind!=="stock"&&(k in cur)&&last[k]!==JSON.stringify(cur[k]))return;
  applyDoc(x.kind,x.id,x.data);c=docsNow();if(c[k])last[k]=JSON.stringify(c[k])});
 for(k in last)if(!seen[k]&&(k in cur)&&last[k]===JSON.stringify(cur[k])){removeDoc(k.slice(0,k.indexOf("|")),k.slice(k.indexOf("|")+1));delete last[k]}
 fixSeq();render();window.cloudSync();flush()}
window.addEventListener("online",function(){status("Back online");resync()});
window.addEventListener("offline",function(){status("Offline: saved on this device")});
window.cloudSales=async function(a,b){var r=await sb.from("docs").select("data").eq("restaurant_id",RID).eq("kind","sale").gte("created_at",a.toISOString()).lt("created_at",b.toISOString()).limit(10000);if(r.error)throw r.error;return r.data.map(function(x){return x.data})};
function subState(){var s=SUB||{},now=Date.now();
 if(s.status==="active")return{ok:true,t:"Subscription active"};
 if(s.status==="trialing"&&new Date(s.trial_ends_at)>now)return{ok:true,t:"Free trial: "+Math.ceil((new Date(s.trial_ends_at)-now)/864e5)+" days left"};
 if(s.status==="past_due"&&s.period_end&&new Date(s.period_end)>now)return{ok:true,t:"Payment overdue, please update billing"};
 return{ok:false,t:"Subscription ended"}}
window.WHO=function(){return(META&&META.email)||ROLE||""};window.canDayClose=function(){return ROLE==="owner"||ROLE==="manager"};
window.verifyPw=async function(pw){if(!navigator.onLine)return"offline";var s=await sb.auth.getSession(),em=s.data.session&&s.data.session.user.email;if(!em)return"offline";var r=await sb.auth.signInWithPassword({email:em,password:pw});return!r.error};
window.billingHTML=function(){var st=subState();return'<p><b>Billing:</b> '+esc(st.t)+'</p>'+(ROLE==="owner"?'<p class="row"><button class="btn alt" id="sub">Subscribe</button><button class="btn alt" id="portal">Manage billing</button></p>':"")};
document.addEventListener("click",async function(e){var b=e.target.closest("button");if(!b||(b.id!=="sub"&&b.id!=="portal"))return;b.disabled=true;
 var r=await sb.functions.invoke(b.id==="sub"?"stripe-checkout":"stripe-portal",{body:{return_url:location.href.split("#")[0]}});
 if(r.error||!r.data||!r.data.url){b.disabled=false;var m=el("gmsg")||el("spm");if(m)m.textContent="Billing is not set up yet. "+(r.error?r.error.message:(r.data&&r.data.error)||"");return}
 location.href=r.data.url});
function showBlocked(){var e=el("gate");e.hidden=false;e.innerHTML='<div class="box"><h1>'+logo(40,null)+'<span>Kedai POS</span></h1><h2 style="margin-top:0">Subscription ended</h2><p>'+(ROLE==="owner"?"Subscribe to keep using the POS. Your data is safe.":"Ask the owner to renew the subscription.")+'</p>'+(ROLE==="owner"?'<p><button class="btn" id="sub">Subscribe</button></p>':"")+'<p><button class="btn alt" id="gout">Sign out</button></p><p id="gmsg" role="alert" style="color:var(--bad)"></p></div>'}
window.cloudSync=function(){if(!RID)return;cacheSave();clearTimeout(tmr);tmr=setTimeout(push,300)};


function onChange(p){
 var key;
 if(p.eventType==="DELETE"){var o=p.old||{};if(!o.kind||o.restaurant_id!==RID)return;removeDoc(o.kind,o.id);delete last[o.kind+"|"+o.id]}
 else{var r=p.new;if(!r||r.updated_by===UID)return;applyDoc(r.kind,r.id,r.data);key=r.kind+"|"+r.id;
  var c=docsNow();if(c[key])last[key]=JSON.stringify(c[key])}
 fixSeq();render()}

async function loadTeam(){
 var r=await sb.from("members").select("user_id,email,role").eq("restaurant_id",RID).order("created_at");
 TEAM=r.data||[];if(view==="team")el("app").innerHTML=teamHTML()}
function teamHTML(){var own=ROLE==="owner";
 return'<div class="panel"><h2>Team</h2><p>Join code for new staff: <b>'+esc(JOIN)+'</b><br><small style="color:var(--mut)">Staff create an account, choose Join with code and enter it. They start as waiters.</small></p><div class="wrap"><table><tr><th>Email</th><th>Role</th></tr>'+
 TEAM.map(function(t){return'<tr><td>'+esc(t.email||"")+'</td><td>'+(own&&t.user_id!==UID?'<select data-role="'+esc(t.user_id)+'" aria-label="Role for '+esc(t.email||"")+'">'+ROLES.map(function(r){return'<option'+(r===t.role?" selected":"")+'>'+r+'</option>'}).join("")+'</select>':esc(t.role))+'</td></tr>'}).join("")+
 '</table></div>'+(own?"":'<p class="empty">Only the owner can change roles.</p>')+'</div>'}
document.addEventListener("change",async function(e){var id=e.target.dataset&&e.target.dataset.role;if(!id)return;
 var r=await sb.from("members").update({role:e.target.value}).eq("restaurant_id",RID).eq("user_id",id);
 status(r.error?"Role change failed":"Role updated");loadTeam()});

var _render=window.render;
window.render=function(){
 if(ROLE&&VIEWS[ROLE].indexOf(view)<0)view="home";
 _render();
 if(!ROLE)return;
 if(view==="team"){el("app").innerHTML=teamHTML();loadTeam()}
 var ok=function(v){return VIEWS[ROLE].indexOf(v)>=0};
 document.querySelectorAll("[data-v]").forEach(function(b){if(b.dataset.v!=="home")b.hidden=!ok(b.dataset.v)});
 var sh=el("shopedit");if(sh)sh.hidden=!(ROLE==="owner"||ROLE==="manager");
 document.querySelectorAll("[data-go]").forEach(function(b){b.hidden=!ok("order")});
 var p=el("pay");if(p&&["owner","manager","cashier"].indexOf(ROLE)<0)p.hidden=true;
 el("signout").hidden=false};

function showGate(mode,msg){gm=mode;var e=el("gate");e.hidden=false;
 var tabs='<div class="row" style="margin-bottom:12px"><button class="chip" data-gm="in" aria-pressed="'+(mode==="in")+'">Sign in</button><button class="chip" data-gm="up" aria-pressed="'+(mode==="up")+'">Create account</button></div>';
 var body=mode==="setup"
  ?'<h2 style="margin-top:0">Set up your restaurant</h2><label>Restaurant name<input id="gn" maxlength="60"></label><button class="btn" id="mk">Create restaurant</button><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><label>Or join with a code from your owner<input id="gj" maxlength="12" autocapitalize="characters"></label><button class="btn alt" id="jn">Join restaurant</button><p><button class="btn alt" id="gout">Sign out</button></p>'
  :tabs+'<label>Email<input id="ge" type="email" autocomplete="username"></label><label>Password (6+ characters)<input id="gp" type="password" autocomplete="'+(mode==="up"?"new-password":"current-password")+'"></label><button class="btn" id="go">'+(mode==="up"?"Create account":"Sign in")+'</button>';
 e.innerHTML='<div class="box"><h1>'+logo(40,null)+'<span>Kedai POS</span></h1>'+body+'<p id="gmsg" role="alert" style="color:var(--bad)">'+esc(msg||"")+'</p></div>'}
el("gate").addEventListener("keydown",function(e){if(e.key==="Enter"){var b=el("go")||el("mk");if(b)b.click()}});
el("gate").addEventListener("click",async function(e){
 var b=e.target.closest("button");if(!b)return;
 var msg=function(t){var m=el("gmsg");if(m)m.textContent=t};
 if(b.dataset.gm){showGate(b.dataset.gm);return}
 if(b.id==="gout"){try{localStorage.removeItem("kp-last")}catch(e){}await sb.auth.signOut();showGate("in");return}
 var r;
 if(b.id==="go"){var em=el("ge").value.trim(),pw=el("gp").value;
  if(!em||pw.length<6){msg("Enter your email and a password of at least 6 characters.");return}
  b.disabled=true;
  if(gm==="up"){r=await sb.auth.signUp({email:em,password:pw});if(!r.error&&!r.data.session){showGate("in","Account created. Check your email to confirm it, then sign in.");return}}
  else r=await sb.auth.signInWithPassword({email:em,password:pw});
  if(r.error){b.disabled=false;msg(r.error.message);return}
  boot();return}
 if(b.id==="mk"){var n=el("gn").value.trim();if(!n){msg("Enter your restaurant name.");return}
  b.disabled=true;r=await sb.rpc("create_restaurant",{p_name:n});if(r.error){b.disabled=false;msg(r.error.message);return}boot();return}
 if(b.id==="jn"){var c=el("gj").value.trim();if(!c){msg("Enter the join code.");return}
  b.disabled=true;r=await sb.rpc("join_restaurant",{p_code:c});if(r.error){b.disabled=false;msg(r.error.message);return}boot()}});
el("signout").addEventListener("click",async function(){try{localStorage.removeItem("kp-last")}catch(e){}await sb.auth.signOut();location.reload()});

async function start(m,cached){
 RID=m.restaurant_id;ROLE=m.role;META=m;SUB=m.restaurants||{};JOIN=SUB.join_code||"";
 S={orders:{},kitchen:[],sales:[],seq:1,stock:{},ledger:[],shifts:[],days:[],shop:{name:SUB.name||"My Restaurant",logo:null}};MENU=[];last={};PEND=[];
 var c=loadCache(),r={};
 if(!cached){r=await fetchDocs();if(r.error){if(!c){showGate("in","Could not load data: "+r.error.message);return}cached=true}}
 if(cached&&c){S=c.S;MENU=c.MENU;last=c.last;PEND=c.pend||[];status("Offline: saved on this device")}
 else{(r.data||[]).forEach(function(x){applyDoc(x.kind,x.id,x.data)});fixSeq();snap()}
 if(!subState().ok){showBlocked();return}
 if(!MENU.length&&can("menu")&&!cached)MENU=JSON.parse(JSON.stringify(DEF));
 if(chan)sb.removeChannel(chan);
 chan=sb.channel("r-"+RID).on("postgres_changes",{event:"*",schema:"public",table:"docs",filter:"restaurant_id=eq."+RID},onChange).subscribe();
 view="home";table="T1";dineTable="T1";tOpen=false;
 el("gate").hidden=true;render();if(!cached)status("Synced");cacheSave();window.cloudSync();flush()}
async function boot(){
 var s=await sb.auth.getSession(),c;
 if(s.data.session)UID=s.data.session.user.id;
 else{var lu=null;try{lu=localStorage.getItem("kp-last")}catch(e){}if(lu&&!navigator.onLine)UID=lu;else{showGate("in");return}}
 try{localStorage.setItem("kp-last",UID)}catch(e){}
 var r=await sb.from("members").select("restaurant_id,role,email,restaurants(name,join_code,status,trial_ends_at,period_end)").eq("user_id",UID).maybeSingle();
 if(r.error){c=loadCache();if(c){await start(c.m,true);return}showGate("in",r.error.message);return}
 if(!r.data){showGate("setup");return}
 await start(r.data)}
el("gate").hidden=false;el("gate").innerHTML='<div class="box"><p>Loading...</p></div>';
boot();
})();
</script>
